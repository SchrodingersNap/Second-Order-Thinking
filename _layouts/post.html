---
layout: default
---

<h1>{{ page.title }}</h1>
<p style="color: #586069; font-size: 0.9rem; margin-bottom: 24px;">
  Published on {{ page.date | date: "%B %d, %Y" }} {% if page.author %}• by {{ page.author }}{% endif %}
</p>

<div class="post-content">
  {{ content }}
</div>

<hr style="margin-top: 40px; margin-bottom: 20px; border: 0; border-top: 1px solid #e1e4e8;">

<!-- Share Section -->
<div class="share-section">
  <h4 style="margin-bottom: 12px; font-size: 1rem; color: #24292e;">Share this article:</h4>
  <div class="share-buttons">
    <a class="share-btn twitter" href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener">X / Twitter</a>
    <a class="share-btn linkedin" href="https://www.linkedin.com/sharing/share-offsite/?url={{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener">LinkedIn</a>
    <a class="share-btn whatsapp" href="https://api.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" target="_blank" rel="noopener">WhatsApp</a>
    <button class="share-btn copy-link" onclick="copyPostUrl(this)">Copy Link</button>
  </div>
</div>

<script>
  function copyPostUrl(btn) {
    navigator.clipboard.writeText(window.location.href);
    const originalText = btn.innerText;
    btn.innerText = "Copied! ✓";
    setTimeout(() => { btn.innerText = originalText; }, 2000);
  }
</script>

<style>
  .share-section {
    margin-top: 30px;
  }
  .share-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .share-btn {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    color: #ffffff !important;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .share-btn.twitter { background-color: #000000; }
  .share-btn.linkedin { background-color: #0a66c2; }
  .share-btn.whatsapp { background-color: #25d366; }
  .share-btn.copy-link { background-color: #586069; }
  .share-btn:hover { opacity: 0.85; text-decoration: none; }
</style>
