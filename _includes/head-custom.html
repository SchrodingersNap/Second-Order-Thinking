<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  function renderMermaid() {
    // Find all code elements tagged with mermaid
    const targets = document.querySelectorAll('code.language-mermaid, pre.mermaid, .language-mermaid code');
    if (targets.length === 0) return;

    targets.forEach((codeEl) => {
      // Find the outermost block generated by Jekyll Rouge
      const container = codeEl.closest('.highlighter-rouge') || codeEl.closest('pre') || codeEl;
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = codeEl.textContent;
      container.replaceWith(pre);
    });

    mermaid.run();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderMermaid);
  } else {
    renderMermaid();
  }
</script>
